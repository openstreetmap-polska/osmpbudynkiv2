[package]
name = "osmpbudynkiv2"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
duckdb = { version = "1.10502.0", features = ["bundled", "vtab", "vtab-arrow", "vscalar"] }
flate2 = "1"
geoarrow = "0.8.0"
prg_convert = { git = "https://github.com/ttomasz/prg_convert", rev = "de879ab983690170e147aeb4069e0947e720977a", default-features = false }
quick-xml = "0.37"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "6"
rocksdb = { version = "0.24", default-features = false, features = ["zstd"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# Release-optimized build with debug symbols kept for profilers (samply, perf).
# Use via `cargo run --profile profiling -- ...` or `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
