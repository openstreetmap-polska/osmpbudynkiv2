[package]
name = "osmpbudynkiv2"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
duckdb = { version = "1.10505.0", features = ["bundled", "vtab", "vtab-arrow", "vscalar", "r2d2"] }
r2d2 = "0.8"
flate2 = "1"
prg_convert = { git = "https://github.com/ttomasz/prg_convert", tag = "v0.7.0", default-features = false, features = ["download"] }
quick-xml = "0.37"
reqwest = { version = "0.12", features = ["rustls-tls", "stream"], default-features = false }
indicatif = "0.17"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "6"
rocksdb = { version = "0.24", default-features = false, features = ["zstd"] }

[dev-dependencies]
assert_cmd = "2"
duckdb = { version = "1.10505.0", features = ["bundled"] }
predicates = "3"
tempfile = "3"
tower = "0.5"

# Release-optimized build with debug symbols kept for profilers (samply, perf).
# Use via `cargo run --profile profiling -- ...` or `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
