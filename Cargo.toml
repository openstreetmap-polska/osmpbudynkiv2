[package]
name = "osmpbudynkiv2"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
# Git dependency, pinned to the tag matching the crates.io version we used before,
# purely to get `bundled-cmake`: DuckDB's jemalloc lives in `duckdb-sources`
# (`third_party/jemalloc`), which the published crate excludes, and the `bundled`
# amalgamation backend has no jemalloc sources at all. `bundled-cmake` builds via
# CMake with `ENABLE_JEMALLOC=ON` by default. See CLAUDE.md's jemalloc gotcha.
duckdb = { git = "https://github.com/duckdb/duckdb-rs", tag = "v1.10505.0", features = ["bundled-cmake", "vtab", "vtab-arrow", "vscalar", "r2d2"] }
r2d2 = "0.8"
flate2 = "1"
prg_convert = { git = "https://github.com/ttomasz/prg_convert", tag = "v0.7.0", default-features = false, features = ["download"] }
quick-xml = "0.37"
reqwest = { version = "0.12", features = ["rustls-tls", "stream"], default-features = false }
indicatif = "0.17"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "6"
rocksdb = { package = "rust-rocksdb", version = "0.52", default-features = false, features = ["zstd", "jemalloc"] }
osmpbf = "0.3.8"

[dev-dependencies]
assert_cmd = "2"
# Must name the same source as the normal dependency above: a registry `duckdb`
# alongside a git one would be two packages both declaring `links = "duckdb"`,
# which cargo rejects outright.
duckdb = { git = "https://github.com/duckdb/duckdb-rs", tag = "v1.10505.0", features = ["bundled-cmake"] }
predicates = "3"
tempfile = "3"
tower = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

# Release-optimized build with debug symbols kept for profilers (samply, perf).
# Use via `cargo run --profile profiling -- ...` or `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
