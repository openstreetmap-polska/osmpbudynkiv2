[package]
name = "osmpbudynkiv2"
version = "0.4.3"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
# Git dependency, pinned to a release tag (v1.20000.1 = DuckDB v2.0.0), purely to
# get `bundled-cmake`: DuckDB's jemalloc lives in `duckdb-sources`
# (`third_party/jemalloc`), which the published crate excludes, and the `bundled`
# amalgamation backend has no jemalloc sources at all. `bundled-cmake` builds via
# CMake with `ENABLE_JEMALLOC=ON` by default. See CLAUDE.md's jemalloc gotcha.
# The crate version also sets the version DuckDB stamps into itself, which is
# its extension repository path (CLAUDE.md, version-stamp gotcha).
#
# `default-features = false` drops `vcpkg`, `pkg-config` and `download-lib`
# (which puts `ureq` into the build script). All three only serve a linked,
# non-bundled build; `duckdb` enables the `capi-v1` bindings itself.
duckdb = { git = "https://github.com/duckdb/duckdb-rs", tag = "v1.20000.1", default-features = false, features = ["bundled-cmake", "appender-arrow", "vscalar", "r2d2"] }
r2d2 = "0.8"
flate2 = "1"
# `import::prg` passes prg_convert's arrow `RecordBatch` into duckdb's Appender
# and its own zip `ZipArchive` into prg_convert, so prg_convert must share both
# the arrow major (duckdb's) and the zip major with this crate.
prg_convert = { git = "https://github.com/ttomasz/prg_convert", tag = "v0.9.0", default-features = false, features = ["download"] }
quick-xml = "0.38"
reqwest = { version = "0.13", features = ["rustls", "stream"], default-features = false }
indicatif = "0.18"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Read-only: `deflate-flate2-zlib-rs` decompresses without `deflate`'s zopfli
# (compression only). It is also what puts flate2, and so `osmpbf`, on zlib-rs
# (CLAUDE.md, `import osm` point 3).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64"] }
rocksdb = { package = "rust-rocksdb", version = "0.53", default-features = false, features = ["zstd", "jemalloc"] }
osmpbf = "0.3.8"
# Only ever pulled in by the `heap-profiling` feature. `rust-rocksdb`'s
# `jemalloc` feature already depends on this exact crate, so naming it here does
# not add a second allocator -- cargo unifies the features onto the one build,
# which is the whole mechanism: it turns `--enable-prof` on for the jemalloc
# that is *already* linked. See docs/heap_profiling.md.
tikv-jemalloc-sys = { version = "0.7", features = ["profiling"], optional = true }

[features]
# Build the (unprefixed, Rust-heap-and-GEOS-backing) jemalloc with profiling
# compiled in. Off by default: a profiling-capable jemalloc is only activated by
# `MALLOC_CONF=prof:true` at runtime, but the feature still changes the built
# artifact, so release builds must not carry it silently.
heap-profiling = ["dep:tikv-jemalloc-sys"]

[dev-dependencies]
assert_cmd = "2"
# Must name the same source as the normal dependency above: a registry `duckdb`
# alongside a git one would be two packages both declaring `links = "duckdb"`,
# which cargo rejects outright.
duckdb = { git = "https://github.com/duckdb/duckdb-rs", tag = "v1.20000.1", default-features = false, features = ["bundled-cmake"] }
predicates = "3"
tempfile = "3"
tower = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

# Release-optimized build with debug symbols kept for profilers (samply, perf).
# Use via `cargo run --profile profiling -- ...` or `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
