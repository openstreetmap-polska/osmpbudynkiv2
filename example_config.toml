# Path to DuckDB database file
db_path = "./osmpbudynkiv2.duckdb"

# Path to RocksDB directory (used to store raw OSM node coordinates and
# structural mappings — way node refs, relation members, reverse indexes)
rocksdb_path = "./osmpbudynkiv2.rocksdb"

# RocksDB block cache size in MB (shared across all column families)
rocksdb_block_cache_mb = 512

# RocksDB write buffer size in MB (per column family)
rocksdb_write_buffer_mb = 64

# Log verbosity: trace, debug, info, warn, error
# Can be overridden by RUST_LOG environment variable
log_level = "info"

# Address and port the HTTP server listens on (used by the `run` command)
http_listen_addr = "127.0.0.1:3000"

# Directory for downloaded files. When not set, the system temp directory is used
# and files are cleaned up automatically after processing.
# download_dir = "./data"

# When true, files that import/update downloaded themselves are deleted once
# consumed. Set to false to keep them in download_dir, e.g. to avoid
# re-downloading a large snapshot across repeated local runs. Never applies
# to a user-supplied --file input, which is never deleted either way.
#
# Caution: download_file/download_file_as skip downloading when a file
# already exists at the destination, and PRG/BDOT10k/EGIB always download to
# the same filename. If this is false and a leftover file isn't removed by
# hand, a later import/update will silently reuse that stale file instead of
# fetching the current snapshot. Does not affect OSM's incremental
# replication downloads (state.txt, per-sequence .osc.gz), which are always
# cleaned up regardless of this setting.
cleanup_downloaded_files = true

# SQL statements executed on DuckDB initialization (after opening the database).
# These run before schema creation.
# WARNING: replacing this list removes the defaults — include everything you need.
#
# Most SET commands below use GLOBAL scope. This is necessary because the
# `run` (HTTP server) command pools multiple DuckDB connections that are
# try_clone()s of one base connection (see server::ClonedConnectionManager)
# rather than separately-opened connections, to let concurrent requests
# actually run in parallel instead of queueing behind a single connection.
# Most DuckDB config options default to GLOBAL scope and are automatically
# visible to every try_clone()'d connection once set on the base connection —
# but a few (e.g. geometry_always_xy, which the spatial extension registers as
# SESSION-scoped) are not, and a bare `SET` would then silently apply only to
# whichever one connection happened to run it, leaving every other pooled
# connection on the DuckDB default. Verified empirically — see
# docs/duckdb_connection_visibility_investigation.md.
# enable_progress_bar is the one exception: DuckDB rejects `SET GLOBAL` for it
# ("cannot be set globally", verified against the duckdb CLI) — it stays
# session-scoped, bare `SET`. That's fine here: it's a purely cosmetic setting
# (whether DuckDB prints a progress bar for long-running queries), not one
# that silently changes query results if a given pooled connection doesn't
# have it, unlike geometry_always_xy.
duckdb_init_commands = [
    "INSTALL spatial",
    "LOAD spatial",
    "INSTALL icu",
    "LOAD icu",
    "SET enable_progress_bar = false",
    "SET GLOBAL preserve_insertion_order = false",
    "SET GLOBAL geometry_always_xy = true",
    "SET GLOBAL temp_directory = './osmpbudynkiv2.duckdb.tmp'",
    "SET GLOBAL max_temp_directory_size = '8GB'",
    "SET GLOBAL memory_limit = '4GB'",
    "SET GLOBAL threads = 8",
]

# Number of connections in the shared DuckDB pool used by the `run` (HTTP
# server) command. All connections are try_clone()s of one base connection, so
# they share live MVCC state and see each other's committed writes immediately
# (see docs/duckdb_connection_visibility_investigation.md) — raising this
# increases how many queries (reads and writes) can genuinely run concurrently
# instead of queueing behind a single connection.
db_pool_size = 8

# TERYT dictionary configuration for PRG address imports.
# The TERYT (TERC) dictionary maps administrative unit codes to names.
[teryt]
# When true, download TERYT dictionary from the government SOAP API automatically.
# When false, a local file must be provided via `file_path` below or `--terc-file` CLI flag.
download = true

# Credentials for the TERYT SOAP API (https://api.stat.gov.pl/Home/TerytApi).
# Falls back to TERYT_API_USERNAME / TERYT_API_PASSWORD environment variables when not set.
# api_username = "myuser"
# api_password = "mypass"

# Path to a local TERC dictionary file (.zip or .xml). Used when download = false.
# Can be overridden by the --terc-file CLI flag.
# file_path = "./data/TERC_Urzedowy.zip"

# Download URLs for data sources
[download_urls]
osm_pbf = "https://download.openstreetmap.fr/extracts/europe/poland-latest.osm.pbf"
bdot10k = "https://opendata.geoportal.gov.pl/bdot10k/schemat2021/GeoParquet/OT_BUBD_A.parquet"
egib = "https://opendata.geoportal.gov.pl/InneDane/latest_exports/eziudp_wfs/PARQUET/0_budynki.parquet"
prg = "https://integracja.gugik.gov.pl/PRG/pobierz.php?adresy_zbiorcze_gml"
osm_replication = "https://download.openstreetmap.fr/replication/europe/poland/minute"
# Curated PRG -> OSM street name mappings (see mappings/street_names_mappings.csv).
# Used by `import street-mappings` when no --file is given, and by the
# street_mappings_update job. The mapping only affects addr:street in /package
# output; it never changes which addresses are considered unmatched.
street_mappings = "https://raw.githubusercontent.com/openstreetmap-polska/osmpbudynkiv2/main/mappings/street_names_mappings.csv"
# Curated BDOT10k/EGIB classification -> OSM building tag mappings (see
# mappings/bdot10k_building_types.csv and mappings/egib_building_types.csv).
# Used by `import building-types` when no --bdot10k-file/--egib-file is
# given, and by the building_types_update job. Applied at serve time only;
# never changes which buildings are considered unmatched.
bdot10k_building_types = "https://raw.githubusercontent.com/openstreetmap-polska/osmpbudynkiv2/main/mappings/bdot10k_building_types.csv"
egib_building_types = "https://raw.githubusercontent.com/openstreetmap-polska/osmpbudynkiv2/main/mappings/egib_building_types.csv"

# Background jobs run by the HTTP server (`run` subcommand).
# Each job has its own enabled flag, interval, and per-run timeout.
# Status is in-memory only (resets on restart) — see GET /status.
[jobs.osm_update]
# When true, OSM minutely diffs are applied every `interval_seconds`.
enabled = true
# How often to start a run. Runs never overlap: the next tick waits
# for the previous run to complete.
interval_seconds = 60
# Maximum wall-clock time for a single run. On timeout the run is
# recorded as TimedOut and the cancel flag is set; the blocking task
# is allowed to drain to keep DuckDB writes ordered.
timeout_seconds = 600

# Prunes old rows from the /package export log (see [updates] and the
# GET /updates endpoint below).
[jobs.export_log_prune]
enabled = true
interval_seconds = 86400
# How long package_exports rows are kept before being deleted.
retention_days = 365

# Government dataset refreshes. Each downloads the current snapshot, diffs it
# against the live table, and applies only the difference in a single
# transaction, so HTTP readers are never disrupted.
#
# A HEAD request compares the source's ETag/Last-Modified against the last
# successful refresh first, so a daily poll costs one round-trip when the
# publisher has not republished. The three refreshes also share a process-wide
# lock so at most one runs at a time, since staging all three simultaneously
# could exceed memory_limit.
[jobs.bdot10k_update]
enabled = true
interval_seconds = 86400
timeout_seconds = 3600

[jobs.egib_update]
enabled = true
interval_seconds = 86400
timeout_seconds = 3600

# PRG streams ~16 GML files out of a ~1.7GB zip, so it gets a longer timeout.
[jobs.prg_update]
enabled = true
interval_seconds = 86400
timeout_seconds = 7200

# Drains the dirty-cell queue (populated by government dataset refreshes and
# OSM updates) by recomputing the affected z14 cells' *_unmatched serving
# tables. Keeps /tiles and /package results current between full comparisons.
[jobs.match_refresh]
enabled = true
interval_seconds = 30
timeout_seconds = 300
# Max number of distinct dirty (source, cell) recomputed per tick.
#
# A cell recompute costs roughly 0.01-0.2s on a Poland-scale database,
# depending on local building density (measured at
# docs/centroid_index_measured.md), so a 512-cell batch comfortably finishes
# inside timeout_seconds. This relies on bdot10k_buildings/egib_buildings
# carrying the persisted, RTREE-indexed `centroid` column that `import
# bdot10k` / `import egib` create -- a database whose tables predate that
# column will fail every bdot10k/egib cell recompute (column not found)
# rather than just running slowly, until those sources are re-imported.
batch_size = 512

# Periodically re-enqueues every live government cell so the drain rebuilds it:
# the safety net for a dropped enqueue. Unlike `compare reconcile` on the CLI,
# this is safe to run against a live server, because it only appends to the
# dirty-cell queue and lets the per-cell drain do the work.
#
# Disabled by default. A sweep enqueues ~339,000 cells, and because the drain
# is oldest-first, those cells sit in front of every subsequent OSM edit and
# delay real updates until the sweep finishes -- so this must only be enabled
# once a sweep finishes well inside interval_seconds. Per-cell recompute cost
# (see the batch_size note on match_refresh above) extrapolates to well under
# a day for a full sweep, but that's an extrapolation from per-cell timings
# (docs/centroid_index_measured.md), not a freshly measured full sweep --
# left disabled pending an actual timed sweep; flip to `true` once that
# number is in and comfortably inside interval_seconds.
[jobs.match_reconcile]
enabled = false
interval_seconds = 86400
timeout_seconds = 1800

# Re-downloads the curated street-name mapping file and reloads it. A HEAD
# request compares the ETag against the last load, so a daily poll costs one
# round-trip when the file has not changed.
#
# Disabled by default: the mapping ships in the binary's repository and most
# deployments will load it once via `import street-mappings`. Enable this only
# if you want a running instance to pick up mapping PRs without a redeploy.
#
# Unlike the dataset refreshes this enqueues no dirty cells and triggers no
# recompute -- the mapping is applied when /package builds its response.
[jobs.street_mappings_update]
enabled = false
interval_seconds = 86400
timeout_seconds = 300

# Re-downloads the curated BDOT10k/EGIB building-type mapping files and
# reloads them. Each file has its own ETag check and its own job_run_log
# entry (job_run_log["update:bdot10k-building-types"] /
# ["update:egib-building-types"]), so a failure or no-op on one never blocks
# the other.
#
# Disabled by default, for the same reason as street_mappings_update: the
# mappings ship in the binary's repository and most deployments will load
# them once via `import building-types`.
[jobs.building_types_update]
enabled = false
interval_seconds = 86400
timeout_seconds = 300

# GeoJSON data package endpoint (GET/POST /package, served by the `run` subcommand).
[package]
# Maximum allowed area of a request's bounding box, in square degrees.
# 0.04 = 0.2° x 0.2° which is roughly 14 x 22 km in Poland.
max_area_sq_deg = 0.04

# GET /updates endpoint (recent /package export activity as GeoJSON).
[updates]
# Time window used when the request omits ?minutes=.
default_minutes = 60
# Largest ?minutes= value accepted; larger requests get a 400.
max_minutes = 1440
