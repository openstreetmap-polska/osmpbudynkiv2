# Path to DuckDB database file
db_path = "./osmpbudynkiv2.duckdb"

# Path to RocksDB directory (used to store raw OSM node coordinates and
# structural mappings — way node refs, relation members, reverse indexes)
rocksdb_path = "./osmpbudynkiv2.rocksdb"

# RocksDB block cache size in MB (shared across all column families)
rocksdb_block_cache_mb = 512

# RocksDB write buffer size in MB (per column family)
rocksdb_write_buffer_mb = 64

# Log verbosity: trace, debug, info, warn, error
# Can be overridden by RUST_LOG environment variable
log_level = "info"

# Address and port the HTTP server listens on (used by the `run` command)
http_listen_addr = "127.0.0.1:3000"

# Directory for downloaded files. When not set, the system temp directory is used
# and files are cleaned up automatically after processing.
# download_dir = "./data"

# SQL statements executed on DuckDB initialization (after opening the database).
# These run before schema creation.
# WARNING: replacing this list removes the defaults — include everything you need.
duckdb_init_commands = [
    "INSTALL spatial",
    "LOAD spatial",
    "SET enable_progress_bar = false",
    "SET preserve_insertion_order = false",
    "SET geometry_always_xy = true",
    "SET temp_directory = './osmpbudynkiv2.duckdb.tmp'",
    "SET max_temp_directory_size = '8GB'",
    "SET memory_limit = '4GB'",
    "SET threads = 8",
]

# TERYT dictionary configuration for PRG address imports.
# The TERYT (TERC) dictionary maps administrative unit codes to names.
[teryt]
# When true, download TERYT dictionary from the government SOAP API automatically.
# When false, a local file must be provided via `file_path` below or `--terc-file` CLI flag.
download = true

# Credentials for the TERYT SOAP API (https://api.stat.gov.pl/Home/TerytApi).
# Falls back to TERYT_API_USERNAME / TERYT_API_PASSWORD environment variables when not set.
# api_username = "myuser"
# api_password = "mypass"

# Path to a local TERC dictionary file (.zip or .xml). Used when download = false.
# Can be overridden by the --terc-file CLI flag.
# file_path = "./data/TERC_Urzedowy.zip"

# Download URLs for data sources
[download_urls]
osm_pbf = "https://download.openstreetmap.fr/extracts/europe/poland-latest.osm.pbf"
bdot10k = "https://opendata.geoportal.gov.pl/bdot10k/schemat2021/GeoParquet/OT_BUBD_A.parquet"
egib = "https://opendata.geoportal.gov.pl/InneDane/latest_exports/eziudp_wfs/PARQUET/0_budynki.parquet"
prg = "https://integracja.gugik.gov.pl/PRG/pobierz.php?adresy_zbiorcze_gml"
osm_replication = "https://download.openstreetmap.fr/replication/europe/poland/minute"

# Background jobs run by the HTTP server (`run` subcommand).
# Each job has its own enabled flag, interval, and per-run timeout.
# Status is in-memory only (resets on restart) — see GET /status.
[jobs.osm_update]
# When true, OSM minutely diffs are applied every `interval_seconds`.
enabled = true
# How often to start a run. Runs never overlap: the next tick waits
# for the previous run to complete.
interval_seconds = 60
# Maximum wall-clock time for a single run. On timeout the run is
# recorded as TimedOut and the cancel flag is set; the blocking task
# is allowed to drain to keep DuckDB writes ordered.
timeout_seconds = 600

# GeoJSON data package endpoint (GET/POST /package, served by the `run` subcommand).
[package]
# Maximum allowed area of a request's bounding box, in square degrees.
# 0.04 = 0.2° x 0.2° which is roughly 14 x 22 km in Poland.
max_area_sq_deg = 0.04
